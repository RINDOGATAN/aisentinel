name: CI

on:
  push:
    branches: [main, p1-quality-wave]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (high and critical)
        # Added 2026-09-14 as a visible, non-blocking gate: the result could not
        # be run locally when it was added, and open dependency-update branches
        # suggest existing advisories. Remove continue-on-error once a run shows
        # no high or critical advisory, so the gate turns hard.
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Security lint (org-isolation / RBAC conventions)
        run: npm run lint:security

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        # NOT `npm run build`: that script now runs `prisma migrate deploy`
        # first (deploy-time migrations on Vercel — deal-room parity), which
        # needs a reachable database. CI has none, so build the way the
        # Dockerfile does: generate + next build only.
        run: npx prisma generate && npx next build
        env:
          # Prisma needs a syntactically valid URL for `prisma generate`; no
          # database is contacted during the build. (The datasource reads the
          # Vercel-scoped name ais_DATABASE_URL, not DATABASE_URL.)
          ais_DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
