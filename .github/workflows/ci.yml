name: CI

on:
  push:
    branches: [main, p1-quality-wave]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (high and critical)
        # Blocking since 2026-09-19, when a run showed no high or critical
        # advisory. Clear a new one with the smallest upgrade that reaches the
        # patched version; never with an override or an ignore list.
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Security lint (org-isolation / RBAC conventions)
        run: npm run lint:security

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        # NOT `npm run build`: that script now runs `prisma migrate deploy`
        # first (deploy-time migrations on Vercel — deal-room parity), which
        # needs a reachable database. CI has none, so build the way the
        # Dockerfile does: generate + next build only.
        run: npx prisma generate && npx next build
        env:
          # Prisma needs a syntactically valid URL for `prisma generate`; no
          # database is contacted during the build. (The datasource reads the
          # Vercel-scoped name ais_DATABASE_URL, not DATABASE_URL.)
          ais_DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"

  fresh-install-smoke:
    # A fresh self-hosted install from zero, then a real browser walks it.
    # Every migration in the tree is applied in order to an empty database by
    # the installer's own script (deploy/sovereign/migrate.sh: migrations,
    # first-boot seed, regulatory content), the app is built in the self-host
    # posture, and e2e/smoke.spec.ts walks a new user's first session at
    # 1280 px and 390 px. Nothing here touches a hosted service.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aisentinel
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: aisentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aisentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: "postgresql://aisentinel:e2e@localhost:5432/aisentinel"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npx tsx e2e/with-env.ts npx prisma generate

      - name: Fresh install (every migration from zero, seed, content)
        run: npx tsx e2e/with-env.ts sh deploy/sovereign/migrate.sh

      - name: Seeded content matches the counts (frameworks, AIUC-1, cross-mappings)
        run: npx tsx e2e/with-env.ts npx vitest run src/config/aiuc1-seed.db.test.ts

      - name: Build (self-host posture)
        run: npx tsx e2e/with-env.ts npx next build

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Smoke walk
        run: npx playwright test

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
